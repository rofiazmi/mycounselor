function move(step){if(step!=='dashboard')stopLivePolling();document.body.classList.remove('print-dashboard');$('#reset').hidden=step==='dashboard';stopTimer();state.step=step;focusNext=true;render();liveSetStatus(liveSyncText);window.scrollTo(0,0);queueLiveState(true);}

function render(){
 const pct={home:0,instrumentIntro:2,instrument:5+state.instrumentPage*10,assessmentSummary:70,gap:77,habit:83,commit:90,final:100,saved:100};progress(pct[state.step]??0);
 switch(state.step){

case 'instrumentIntro':renderInstrumentIntro();break;
case 'dashboard':renderDashboard();break;
case 'instrument':renderInstrument();break;
case 'assessmentSummary':renderAssessmentSummary();break;
 case 'gap':frame(`${meta('Celah integritas','TIDAK DIKUMPULKAN')}${title('Nilai saya.<br><em>Tindakan saya.</em>')}<p class="copy">Tuliskan secukupnya. Tidak perlu memasukkan nama, kejadian sensitif, atau identitas orang lain.</p><div class="form-grid">${['Nilai yang saya percaya','Tetapi kadang saya…','Satu celah yang ingin saya tutup'].map((v,i)=>`<div class="field"><label for="gap${i}">${v}</label><textarea id="gap${i}" data-gap="${i}" maxlength="700" placeholder="${['Contoh: menghargai kontribusi orang lain','Contoh: diam ketika menerima pujian yang bukan hanya milik saya','Contoh: menyebut peran rekan dengan lebih jelas'][i]}">${esc(state.gap[i])}</textarea></div>`).join('')}</div><p class="hint">Isian ini tidak masuk ke kartu komitmen dan tidak disimpan ke peramban.</p>${nextButton('Pilih latihan saya')}<div class="actions"><button class="link-button" data-action="gapSkip">Lewati isian pribadi</button></div>`);break;
 case 'habit':frame(`${meta('Satu perubahan kecil','LATIHAN HARIAN')}${title('Tidak harus besar.<br><em>Harus bisa dilakukan.</em>')}<div class="concepts">${HABITS.map((v,i)=>`<article><span class="n">0${i+1}</span><h3>${v}</h3><p>${HABIT_DETAILS[i]}</p><button class="btn ${state.habit===v?'primary':''}" aria-pressed="${state.habit===v}" data-action="habit" data-value="${i}">Latih ${v.toLowerCase()}</button></article>`).join('')}</div>${nextButton('Tulis satu komitmen','habitNext',!state.habit)}`);break;
 case 'commit':frame(`${meta('Komitmen saya','SATU LANGKAH NYATA')}${title('Besok, saya mulai<br><em>dari sini.</em>')}<p class="copy">Latihan yang Anda pilih: <strong>${esc(state.habit)}</strong>. Buat tindakan yang spesifik dan ada waktunya.</p><div class="form-grid"><div class="field"><label for="actionInput">Satu tindakan yang akan saya lakukan</label><textarea id="actionInput" data-field="action" maxlength="250" placeholder="Contoh: menyebut kontribusi setiap anggota saat melaporkan hasil tim.">${esc(state.action)}</textarea></div><div class="field"><label for="whenInput">Kapan atau dalam situasi apa?</label><input id="whenInput" data-field="when" maxlength="120" value="${esc(state.when)}" placeholder="Contoh: pada rapat tim besok pagi."></div><div class="field"><label for="supportInput">Jika ada tekanan, langkah pendukung saya <span class="muted">(opsional)</span></label><input id="supportInput" data-field="support" maxlength="160" value="${esc(state.support)}" placeholder="Contoh: menyiapkan catatan kontribusi sebelum rapat."></div></div><p class="error" id="formError" role="alert"></p>${nextButton('Buat kartu komitmen','finish')}<p class="hint">Progres tersinkron otomatis pada kegiatan live. Isi komitmen dibagikan hanya jika Anda menyetujuinya saat masuk.</p>`);break;
 case 'final':renderFinal(getCommit(),false);break;
 case 'saved':if(saved)renderFinal(saved,true);else move('home');break;
}
}
function getCommit(){return {habit:state.habit,action:state.action.trim(),when:state.when.trim(),support:state.support.trim(),challenge:state.challenge,name:state.name.trim(),report:state.report,date:new Date().toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'})};}
function card(v){return `<article class="commit-card" id="commitCard"><p class="label">REFLEKSI INTEGRITAS / KOMITMEN PRIBADI</p><h3>Saya memilih untuk<br>${esc(v.habit.toLowerCase())}.</h3><blockquote>${esc(v.action)}</blockquote><p><strong>Kapan:</strong> ${esc(v.when)}</p>${v.support?`<p><strong>Saat ada tekanan:</strong> ${esc(v.support)}</p>`:''}<div class="card-foot">${esc(PROGRAM)}<br>${esc(v.date)}<br><strong>Biasakan yang benar. Bukan benarkan yang biasa.</strong></div></article>`;}
function renderFinal(v,isSaved){frame(`${meta(isSaved?'Komitmen tersimpan':'Satu komitmen. Bawa pulang.','UNTUK ANDA')}${title('Biasakan yang benar.<br><em>Bukan benarkan yang biasa.</em>')}${v.report?'<div class="report-tools no-print"><button class="btn primary" data-action="print">Cetak rapor & komitmen / PDF</button><p class="hint">Tiga halaman A4: rapor · surat untuk diri · komitmen.<br>Pilih Simpan sebagai PDF, skala 100%, dan nonaktifkan header/footer peramban.</p></div>'+reportPack(v):card(v)}<div class="actions">${isSaved?'':'<button class="btn primary" data-action="save">Simpan di perangkat ini</button>'}<button class="btn ${isSaved?'primary':''}" data-action="download">Unduh kartu gambar</button><button class="btn" data-action="print">Cetak rapor & komitmen / PDF</button><button class="btn" data-action="textDownload">Unduh komitmen teks</button></div><div class="status" id="saveStatus" role="status">${isSaved?'Simpanan pribadi diambil dari peramban ini.':''}</div><p class="hint">Rapor, nama panggilan, dan komitmen yang disimpan di perangkat ini dapat dibaca pengguna lain yang memakai profil peramban yang sama. Gunakan tombol hapus simpanan bila diperlukan.</p><p class="source-note">Integritas tumbuh melalui keputusan sehari-hari. Rapor ini merangkum refleksi Anda; komitmen mengubahnya menjadi tindakan.</p>`);}
function downloadBlob(blob,name){const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),3000);}
function downloadText(v){downloadBlob(new Blob([`KOMITMEN INTEGRITAS\n${PROGRAM}\n${v.date}\n\nLatihan: ${v.habit}\nTindakan: ${v.action}\nKapan: ${v.when}\n${v.support?'Saat ada tekanan: '+v.support+'\n':''}\nBiasakan yang benar. Bukan benarkan yang biasa.`],{type:'text/plain;charset=utf-8'}),'komitmen-integritas.txt');}
function downloadImage(v){const can=document.createElement('canvas');can.width=1200;const ctx=can.getContext('2d');const lines=(t,w,font)=>{ctx.font=font;const out=[];for(const p of String(t).split('\n')){let line='';for(const word of p.split(/\s+/)){if(ctx.measureText(word).width>w){if(line){out.push(line);line='';}let piece='';for(const ch of word){if(ctx.measureText(piece+ch).width>w){out.push(piece);piece=ch;}else piece+=ch;}line=piece;}else if(line&&ctx.measureText(line+' '+word).width>w){out.push(line);line=word;}else line+=(line?' ':'')+word;}out.push(line);}return out;};const action=lines(v.action,1000,'bold 42px Arial'),when=lines('Kapan: '+v.when,1000,'28px Arial'),support=v.support?lines('Saat ada tekanan: '+v.support,1000,'28px Arial'):[],heading=lines(v.habit.toUpperCase(),1000,'bold 52px Arial');can.height=580+Math.max(0,heading.length-1)*65+action.length*58+(when.length+support.length)*42;ctx.fillStyle='#c6ff3d';ctx.fillRect(0,0,can.width,can.height);ctx.fillStyle='#111214';ctx.fillRect(0,0,can.width,80);ctx.fillStyle='#c6ff3d';ctx.font='bold 22px Arial';ctx.fillText('REFLEKSI INTEGRITAS / KOMITMEN PRIBADI',70,50);ctx.fillStyle='#111214';ctx.font='bold 52px Arial';ctx.fillText('SAYA MEMILIH UNTUK',70,170);let y=240;for(const l of heading){ctx.font='bold 52px Arial';ctx.fillText(l,70,y);y+=65;}y+=45;ctx.font='bold 42px Arial';action.forEach(l=>{ctx.fillText(l,70,y);y+=58;});y+=30;ctx.font='28px Arial';[...when,...support].forEach(l=>{ctx.fillText(l,70,y);y+=42;});ctx.fillRect(70,can.height-150,1060,2);ctx.font='bold 24px Arial';ctx.fillText('BIASAKAN YANG BENAR. BUKAN BENARKAN YANG BIASA.',70,can.height-110);ctx.font='22px Arial';ctx.fillText(PROGRAM,70,can.height-70);ctx.fillText(v.date,70,can.height-36);can.toBlob(b=>{if(b)downloadBlob(b,'komitmen-integritas.png');},'image/png');}

];
const SCALE_LABELS=['Hampir tidak pernah','Jarang','Kadang-kadang','Sering','Hampir selalu'];
function renderInstrumentIntro(){renderLiveIntro();}
function pageComplete(){return state.responses.slice(state.instrumentPage*4,state.instrumentPage*4+4).every(v=>v!==null);}
function renderInstrument(){const d=DIMENSIONS[state.instrumentPage],base=state.instrumentPage*4;frame(`${meta(`Bagian ${state.instrumentPage+1} / 6`,d.title)}${title('Bagaimana kebiasaan<br><em>Anda belakangan ini?</em>')}<p class="small muted">Dalam 30 hari terakhir, seberapa sering pernyataan berikut menggambarkan tindakan Anda? Semua jawaban tetap pribadi.</p><div class="assess-progress" aria-hidden="true">${DIMENSIONS.map((x,i)=>`<i class="${i<=state.instrumentPage?'done':''}"></i>`).join('')}</div>${d.items.map((text,j)=>{const ix=base+j;return `<fieldset class="item-box"><legend>${ix+1}. ${text}</legend><div class="rating-options">${SCALE_LABELS.map((label,k)=>`<label class="rating-option"><input type="radio" name="instrumentRating${ix}" data-item="${ix}" value="${k+1}" ${state.responses[ix]===k+1?'checked':''}><b>${k+1}</b><span>${label}</span></label>`).join('')}<label class="rating-option"><input type="radio" name="instrumentRating${ix}" data-item="${ix}" value="na" ${state.responses[ix]==='na'?'checked':''}><b>—</b><span>Belum mengalami</span></label></div></fieldset>`;}).join('')}<p class="small muted" id="instrumentCount"></p><div class="assessment-nav"><button class="btn" data-action="instrumentPrev" ${state.instrumentPage===0?'disabled':''}>Bagian sebelumnya</button><button class="btn primary" data-action="instrumentNext" ${pageComplete()?'':'disabled'}>${state.instrumentPage===5?'Baca hasil refleksi':'Bagian berikutnya'}</button></div><p class="hint">Tidak ada hitung mundur. Ambil waktu untuk mengingat perilaku nyata.</p>`);updateInstrumentCounter();}
function updateInstrumentCounter(){const filled=state.responses.filter(v=>v!==null).length;$('#instrumentCount').textContent=`${filled} dari 24 pernyataan sudah diisi.`;const b=$('[data-action="instrumentNext"]');if(b)b.disabled=!pageComplete();}
function scoreInstrument(responses){const dims=DIMENSIONS.map((d,i)=>{const values=responses.slice(i*4,i*4+4).map((v,j)=>typeof v==='number'&&v>=1&&v<=5?(j===3?6-v:v):null).filter(v=>v!==null);const n=values.length;return {key:d.key,title:d.title,n,mean:n>=3?values.reduce((a,b)=>a+b,0)/n:null};});const complete=dims.every(d=>d.mean!==null);return {version:'1.0',dimensions:dims,mean:complete?dims.reduce((a,d)=>a+d.mean,0)/6:null,coverage:dims.reduce((a,d)=>a+d.n,0),period:'30 hari terakhir'};}
function fmt(v){return v===null?'—':Number(v).toLocaleString('id-ID',{minimumFractionDigits:1,maximumFractionDigits:1});}
function frequency(mean){if(mean===null)return 'Belum cukup jawaban untuk dihitung';return ['Hampir tidak pernah dilakukan','Jarang dilakukan','Kadang-kadang dilakukan','Sering dilakukan','Hampir selalu dilakukan'][Math.round(mean)-1];}
function summaryMeaning(mean){if(mean===null)return 'Ada bagian yang belum memiliki cukup jawaban. Anda tetap bisa memilih satu kebiasaan untuk dilatih.';if(mean<1.5)return 'Dari jawaban Anda, kebiasaan menjaga integritas hampir belum dilakukan. Mulailah dari satu langkah kecil yang realistis.';if(mean<2.5)return 'Dari jawaban Anda, kebiasaan menjaga integritas masih jarang dilakukan. Pilih satu kebiasaan untuk mulai dilatih.';if(mean<3.5)return 'Dari jawaban Anda, kebiasaan menjaga integritas sudah dilakukan dalam beberapa situasi, tetapi belum konsisten.';if(mean<4.5)return 'Dari jawaban Anda, kebiasaan menjaga integritas sudah cukup sering dilakukan, meski belum selalu konsisten.';return 'Dari jawaban Anda, kebiasaan menjaga integritas hampir selalu dilakukan. Terus rawat saat menghadapi tekanan.';}
function reportInsights(report){const usable=report.dimensions.filter(d=>d.mean!==null),max=usable.length?Math.max(...usable.map(d=>d.mean)):null,min=usable.length?Math.min(...usable.map(d=>d.mean)):null;const tied=max!==null&&Math.abs(max-min)<.00001;const strong=usable.filter(d=>Math.abs(d.mean-max)<.00001),grow=usable.filter(d=>Math.abs(d.mean-min)<.00001);return {tied,strong:strong[0],grow:grow[0],strongText:tied?'Pola jawaban seimbang':strong.length>1?'Beberapa aspek sama kuat':strong[0]?.title||'Belum cukup data',growthText:tied?'Pilih satu aspek untuk dilatih':grow.length>1?'Beberapa aspek sama-sama dapat dilatih':grow[0]?.title||'Mulai dengan satu pengalaman nyata',suggestion:grow[0]?DIMENSIONS.find(d=>d.key===grow[0].key).growth:'Amati satu keputusan nyata minggu ini, lalu isi kembali berdasarkan pengalaman itu.'};}
function resultsBars(report,print=false){return `<div class="${print?'report-bars':'result-bands'}">${report.dimensions.map(d=>`<div class="${print?'report-bar':'result-band'}"><${print?'header':'div'} class="${print?'':'band-top'}"><b>${esc(d.title)}</b><span>${fmt(d.mean)}${d.mean===null?'':' / 5'}</span></${print?'header':'div'}><div class="bar-track" aria-label="${esc(d.title)} ${d.mean===null?'belum cukup data':fmt(d.mean)+' dari 5'}"><span style="width:${d.mean===null?0:((d.mean-1)/4*100).toFixed(2)}%"></span></div><${print?'small':'div'} class="coverage">${d.n} / 4 pengalaman dinilai · ${d.mean===null?'Belum cukup data':frequency(d.mean)}</${print?'small':'div'}></div>`).join('')}</div>`;}

function reportPack(v){const r=v.report,i=reportInsights(r),name=v.name?.trim()||'diri saya',period=r.period||'30 hari terakhir';return `<div class="print-pack" id="reportPack">

<section class="report-page letter"><div class="report-header">${brandLogos('report-brands')}<span>Surat pribadi · 2/3</span></div><p class="report-kicker">BACA PELAN-PELAN. BERI DIRI ANDA WAKTU.</p><h2>Anda tidak selesai<br>pada sebuah angka.</h2><div class="letter-copy"><p>Untuk ${esc(name)},</p><p>Mungkin ada jawaban yang mudah Anda pilih. Mungkin ada pula yang membuat Anda berhenti, menarik napas, lalu mengingat sebuah janji, sebuah percakapan, atau satu kesempatan ketika diam terasa lebih aman. Anda tidak perlu menceritakannya kepada siapa pun. Cukup bersedia melihatnya dengan jujur.</p><p>${i.tied?'Pada aspek yang cukup terisi, ringkasan jawaban Anda menunjukkan frekuensi yang seimbang. Tidak ada satu aspek yang lebih menonjol. Anda dapat memilih kebiasaan yang paling bermakna untuk dilatih saat ini.':i.strong?`Dalam jawaban yang dapat dinilai, <strong>${esc(i.strong.title.toLowerCase())}</strong> termasuk kebiasaan yang relatif lebih sering hadir. Itu dapat menjadi bekal untuk latihan berikutnya. Ia bukan alasan untuk berhenti belajar, melainkan sesuatu yang bisa Anda rawat melalui tindakan.`:'Ada pengalaman yang belum cukup untuk diringkas menjadi angka. Ruang kosong itu tidak berarti Anda gagal. Ia mengajak Anda mengamati kehidupan nyata dengan lebih sadar.'}</p><p>${i.grow&&!i.tied?`Pada aspek <strong>${esc(i.grow.title.toLowerCase())}</strong>, jawaban Anda memberi ruang untuk latihan berikutnya. Tidak semua perubahan harus dramatis. Anda dapat mulai dengan langkah ini: ${esc(i.suggestion.charAt(0).toLowerCase()+i.suggestion.slice(1))}`:'Anda tidak harus memperbaiki semuanya sekaligus. Pilih satu kebiasaan yang bermakna bagi kehidupan Anda sekarang, lalu beri kebiasaan itu waktu untuk tumbuh.'}</p><p>Anda memilih latihan <strong>${esc(v.habit.toLowerCase())}</strong>. Ketika tekanan datang, ingatlah bahwa keberanian bisa terdengar tenang: “Saya perlu mengoreksi ini.” “Kontribusi itu milik teman saya.” “Saya belum mampu memenuhi janji itu.” Kalimat sederhana dapat menjadi awal hubungan yang lebih jujur.</p><p>Jika suatu hari Anda meleset, jangan berhenti pada rasa bersalah. Akui bagian Anda, perbaiki dampaknya, lalu kembali pada langkah yang telah Anda pilih. Anda bertanggung jawab atas tindakan, dan Anda juga berhak memberi diri sendiri kesempatan untuk belajar.</p></div><blockquote>Ketika tidak ada yang melihat,<br>satu pilihan kecil tetap dapat menjaga kepercayaan.</blockquote><p>Mulailah dari komitmen di halaman berikutnya. Bukan untuk terlihat sempurna, tetapi untuk semakin dapat dipercaya.</p><div class="report-foot"><span>Biasakan yang benar. Bukan benarkan yang biasa.</span><span>Milik pribadi</span></div></section>

 if(liveConnection)return liveConnection;

function livePayload(){if(!liveRegistered||!liveProfile||!LIVE_LABELS[state.step])return null;const finished=state.step==='final';return {action:'update',id:liveProfile.id,token:liveProfile.token,sequence:++liveProfile.sequence,answered:state.responses.filter(v=>v!==null).length,stage:state.step,report:state.report,habit:state.habit,commitmentWritten:finished&&!!state.action.trim()&&!!state.when.trim(),commitment:finished&&liveProfile.shareCommitment?{shared:true,action:state.action.trim(),when:state.when.trim(),support:state.support.trim()}:null};}
function queueLiveState(immediate=false){const p=livePayload();if(!p)return;liveQueued=p;saveLiveDraft();liveSetStatus('Mengirim progres…');clearTimeout(liveTimer);liveTimer=setTimeout(flushLive,immediate?0:Math.max(1200,4500-(Date.now()-liveLastSent))+Math.random()*500);}
async function flushLive(){if(liveSending||!liveQueued)return;if(!liveRegistered||!liveProfile)return;if(!navigator.onLine){liveSetStatus('Internet terputus. Progres akan dikirim saat terhubung kembali.');liveTimer=setTimeout(flushLive,15000);return;}const p=liveQueued;liveQueued=null;liveSending=true;liveLastSent=Date.now();try{const data=await liveApi(p);liveProfile.sequence=Math.max(liveProfile.sequence,data.sequence||0);if(data.accepted===false&&data.sequence>p.sequence){queueLiveState(true);return;}saveLiveDraft();liveSetStatus((p.stage==='final'?'Hasil selesai tersinkron':'Progres tersinkron')+' · '+new Date(data.serverTime).toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit',second:'2-digit'}));}catch(e){if(!liveQueued)liveQueued=p;liveSetStatus('Belum tersinkron: '+e.message);}finally{liveSending=false;if(liveQueued){clearTimeout(liveTimer);liveTimer=setTimeout(flushLive,Math.max(4500-(Date.now()-liveLastSent),liveSyncText.startsWith('Belum')?15000:1200));}}}
window.addEventListener('online',()=>flushLive());
function stopLivePolling(){clearInterval(livePoll);livePoll=null;}
function enterLiveDashboard(){move('dashboard');if(liveConfigured()&&!liveDemo){refreshLiveDashboard();startLivePolling();}}
function startLivePolling(){stopLivePolling();livePoll=setInterval(()=>{if(state.step==='dashboard'&&liveConfigured()&&!liveDemo&&!document.hidden)refreshLiveDashboard();},LIVE_CONFIG.refreshMs);}
async function refreshLiveDashboard(){if(liveSnapshotBusy||!liveConfigured()||liveDemo||state.step!=='dashboard')return;liveSnapshotBusy=true;try{const data=await liveApi({action:'snapshot'});if(!Array.isArray(data.records))throw new Error('Data layanan belum sesuai.');liveRecords=data.records;liveLastRefresh=data.serverTime;liveDashboardError='';paintLiveDashboard();}catch(e){liveDashboardError='Pembaruan belum tersedia: '+e.message;const s=$('#liveDashboardStatus');if(s)s.textContent=liveDashboardError;}finally{liveSnapshotBusy=false;}}
function rowsLive(){return liveRecords;}
function filterLive(){return rowsLive().filter(r=>(!liveSearch||(r.name+' '+r.code+' '+r.group).toLowerCase().includes(liveSearch.toLowerCase()))&&(!liveGroup||r.group===liveGroup)&&(!liveFilter||(liveFilter==='final'?r.stage==='final':liveFilter==='registered'?r.stage==='registered':r.stage!=='final'&&r.stage!=='registered'))).sort((a,b)=>a.name.localeCompare(b.name,'id'));}
function liveScoreRows(){return rowsLive().filter(r=>r.stage==='final'&&r.report);}
function renderDashboard(){
 if(!liveConfigured()&&!liveDemo){frame(`${meta('Dashboard terbuka','TANPA KUNCI')}${title('Pantau progres.<br><em>Langsung dari sini.</em>')}<div class="notice">Koneksi live belum diaktifkan. Pengelola cukup memasang satu URL Web App dari Apps Script ke LIVE_CONFIG.</div><div class="actions"><button class="btn primary" data-action="liveDemo">Lihat contoh progres live</button><button class="btn" data-action="participantHome">Kembali ke halaman peserta</button></div>`);return;}
 frame(`<div class="dashboard"><div class="dash-heading">${meta('Dashboard fasilitator',liveDemo?'CONTOH PROGRES':'LIVE · TANPA KUNCI')}${title('Lihat progresnya.<br><em>Dampingi tumbuhnya.</em>')}<p class="intro">Lihat siapa yang mengisi, berada di tahap apa, dan sudah menyelesaikan komitmen. Hasil muncul tanpa impor atau kirim berkas.</p></div>${liveDemo?'<div class="notice dash-demo no-print"><strong>Contoh data fiktif.</strong> Tampilan ini bukan koneksi live dan bukan hasil peserta Anda.</div>':''}<div class="actions no-print"><button class="btn primary" data-action="liveRefresh" ${liveDemo?'disabled':''}>Perbarui sekarang</button><button class="btn" data-action="liveCsv">Unduh rekap CSV / Excel</button><button class="btn" data-action="dashboardPrint">Cetak ringkasan / PDF</button><button class="btn" data-action="liveLogout">${liveDemo?'Tutup contoh':'Tutup dashboard'}</button><button class="btn" data-action="participantHome">Halaman peserta</button></div><p class="status no-print" id="liveDashboardStatus" role="status"></p><div class="dash-metrics" id="liveMetrics"></div><div class="dash-charts" id="liveCharts"></div><section class="dash-section"><h2>Progres tiap peserta</h2><p class="small muted">Progres isian memakai jumlah pernyataan yang diisi, termasuk “Belum mengalami”. Progres kegiatan mencakup membaca rapor dan menulis komitmen. Peserta yang belum membuka kegiatan belum tercatat. Dashboard ini bebas akses; nama lengkap dan kelompok ditampilkan per peserta.</p><div class="dash-controls no-print"><div><label for="liveSearch">Cari nama lengkap</label><input id="liveSearch" type="search" maxlength="150" value="${esc(liveSearch)}" placeholder="Cari peserta…"></div><div><label for="liveGroupFilter">Kelompok</label><select id="liveGroupFilter"></select></div><div><label for="liveStatusFilter">Tahap</label><select id="liveStatusFilter"><option value="">Semua tahap</option><option value="registered">Belum mulai</option><option value="working">Sedang mengerjakan</option><option value="final">Selesai</option></select></div></div><div id="liveTable"></div></section><p class="dash-paper-note" id="livePrintNote"></p><p class="hint">Waktu aktivitas terakhir menunjukkan pembaruan yang diterima server. Koneksi terputus bisa membuat progres tertinggal. Status selesai berarti instrumen dan komitmen telah dibuat, bukan komitmen sudah dijalankan.</p></div>`);$('#liveStatusFilter').value=liveFilter;paintLiveDashboard();
}
function paintLiveDashboard(){if(!$('#liveMetrics'))return;const rows=rowsLive(),done=rows.filter(r=>r.stage==='final'),scored=done.filter(r=>r.report?.mean!==null&&r.report),mean=scored.length?scored.reduce((s,r)=>s+r.report.mean,0)/scored.length:null;$('#liveMetrics').innerHTML=[['Peserta masuk',rows.length,'Sudah terdaftar dalam kegiatan'],['Sedang mengerjakan',rows.filter(r=>!['registered','final'].includes(r.stage)).length,'Belum menyelesaikan komitmen'],['Selesai',done.length,'Instrumen dan komitmen selesai'],['Skor refleksi kelompok',fmt(mean),scored.length+' hasil lengkap · skala 1–5']].map(([label,value,note])=>`<article class="dash-metric"><p class="label">${label}</p><strong>${value}</strong><small>${note}</small></article>`).join('');
 $('#liveCharts').innerHTML=`<section class="dash-section"><h2>Pola enam aspek</h2><p class="small muted">Ringkasan seluruh peserta yang selesai. Filter daftar tidak mengubah grafik ini.</p>${DIMENSIONS.map(d=>{const a=done.map(r=>r.report?.dimensions.find(x=>x.key===d.key)).filter(x=>x&&x.mean!==null),m=a.length?a.reduce((s,x)=>s+x.mean,0)/a.length:null;return `<div class="dash-bar"><header><b>${esc(d.title)}</b><span>${fmt(m)}${m===null?'':' dari 5'}</span></header><div class="bar-track"><span style="width:${m===null?0:(m-1)/4*100}%"></span></div><small>${a.length} peserta dapat dinilai</small></div>`;}).join('')}</section><section class="dash-section"><h2>Perjalanan peserta</h2>${[['Belum mulai mengisi',rows.filter(r=>r.stage==='registered').length],['Mengisi instrumen',rows.filter(r=>r.stage==='instrument').length],['Membaca & refleksi',rows.filter(r=>['assessmentSummary','gap','habit'].includes(r.stage)).length],['Menulis komitmen',rows.filter(r=>r.stage==='commit').length],['Selesai',done.length]].map(([name,n])=>`<div class="dash-habit"><span>${name}</span><strong>${n}</strong></div>`).join('')}<div class="notice"><strong>Baca dengan empati.</strong><p class="small">Skor merangkum jawaban pribadi; bukan peringkat kejujuran. Instrumen belum diuji secara psikometrik. Jawaban per pernyataan dan celah pribadi tidak dikirim.</p></div></section>`;
 const groups=[...new Set(rows.map(r=>r.group))].sort((a,b)=>a.localeCompare(b,'id'));if(liveGroup&&!groups.includes(liveGroup))liveGroup='';const options='<option value="">Semua kelompok</option>'+groups.map(g=>`<option value="${esc(g)}">${esc(g)}</option>`).join('');if($('#liveGroupFilter').innerHTML!==options)$('#liveGroupFilter').innerHTML=options;$('#liveGroupFilter').value=liveGroup;
 $('#liveDashboardStatus').textContent=liveDemo?'Contoh data fiktif · tidak terhubung server':liveDashboardError||(liveLastRefresh?'Terhubung · pembaruan otomatis setiap 15 detik · terakhir '+new Date(liveLastRefresh).toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit',second:'2-digit'}):'Menghubungkan dashboard…');renderLiveTable();
}
function renderLiveTable(){if(!$('#liveTable'))return;const rows=filterLive();$('#livePrintNote').textContent=(liveDemo?'CONTOH DATA FIKTIF. ':'')+'Dicetak '+new Date().toLocaleString('id-ID')+'. Daftar: '+(liveGroup||'semua kelompok')+(liveSearch?', pencarian '+liveSearch:'')+(liveFilter?', tahap '+liveFilter:'')+'. Grafik merangkum seluruh hasil selesai.';$('#liveTable').innerHTML=`<p class="small muted">${rows.length} dari ${rowsLive().length} peserta ditampilkan.</p>${rows.length?`<div class="dash-table-wrap" tabindex="0" aria-label="Daftar progres peserta, geser untuk melihat semua kolom"><table class="dash-table"><thead><tr><th>Peserta</th><th>Kelompok</th><th>Progres</th><th>Tahap</th><th>Aktivitas terakhir</th><th>Skor refleksi</th><th>Detail</th></tr></thead><tbody>${rows.map(r=>`<tr><td><b>${esc(r.name)}</b></td><td>${esc(r.group)}</td><td><b>${r.answered} / 24 isian</b><div class="bar-track"><span style="width:${Math.max(0,Math.min(100,r.percent))}%"></span></div><small>${r.percent}% kegiatan</small></td><td><span class="dash-tag">${esc(LIVE_LABELS[r.stage]||r.stageLabel)}</span></td><td>${esc(new Date(r.updatedAt).toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit',second:'2-digit'}))}<small>${esc(new Date(r.updatedAt).toLocaleDateString('id-ID'))}</small></td><td>${r.stage==='final'&&r.report?fmt(r.report.mean)+(r.report.mean===null?'':' dari 5'):'—'}</td><td><button class="btn" data-action="liveDetail" data-index="${rowsLive().indexOf(r)}">Lihat</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="dash-empty">Belum ada peserta untuk ditampilkan. Peserta akan tercatat setelah mulai mengisi instrumen.</div>'}`;}
function liveDetail(index){const r=rowsLive()[index];if(!r)return;showDataModal(`<h2 id="dataModalTitle">${esc(r.name)}</h2><p class="muted">${esc(r.code)} · ${esc(r.group)}</p><div class="notice"><strong>${esc(LIVE_LABELS[r.stage])}</strong><br>${r.answered} dari 24 pernyataan diisi · ${r.percent}% kegiatan<br>Aktivitas terakhir: ${esc(new Date(r.updatedAt).toLocaleString('id-ID'))}</div>${r.stage==='final'&&r.report?`<p><strong>Skor refleksi: ${fmt(r.report.mean)}${r.report.mean===null?'':' dari 5'}.</strong> ${summaryMeaning(r.report.mean)}</p>${resultsBars(r.report)}<h3>Latihan: ${esc(r.habit)}</h3>${r.commitment?`<div class="panel"><p><strong>Tindakan:</strong> ${esc(r.commitment.action)}</p><p><strong>Kapan:</strong> ${esc(r.commitment.when)}</p>${r.commitment.support?`<p><strong>Langkah pendukung:</strong> ${esc(r.commitment.support)}</p>`:''}</div>`:'<p>Komitmen sudah ditulis. Peserta memilih menyimpan isinya secara pribadi.</p>'}`:'<p>Ringkasan hasil akan muncul setelah peserta menyelesaikan instrumen dan komitmen.</p>'}<div class="actions"><button class="btn primary" data-action="cancelReset">Tutup</button></div>`);}
function csvCell(value){let s=String(value??'');if(/^[\s\u0000-\u001f]*[=+@-]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"';}
function exportLiveCsv(){const header=['Kode','Nama','Kelompok','Terisi (24)','Progres kegiatan (%)','Tahap','Mulai','Aktivitas terakhir','Selesai','Skor refleksi',...DIMENSIONS.map(d=>d.title),'Latihan','Tindakan dibagikan','Waktu','Langkah pendukung'];const rows=filterLive().map(r=>[r.code,r.name,r.group,r.answered,r.percent,LIVE_LABELS[r.stage],r.startedAt,r.updatedAt,r.completedAt,r.stage==='final'?fmt(r.report?.mean??null):'',...DIMENSIONS.map(d=>r.stage==='final'?fmt(r.report?.dimensions.find(x=>x.key===d.key)?.mean??null):''),r.habit,r.commitment?.action||'',r.commitment?.when||'',r.commitment?.support||'']);downloadBlob(new Blob(['\uFEFF'+[header,...rows].map(row=>row.map(csvCell).join(';')).join('\r\n')],{type:'text/csv;charset=utf-8'}),liveDemo?'contoh-progres-integritas.csv':'progres-integritas-peserta.csv');}
function sampleLive(){return ['Alya','Bagas','Citra','Dimas','Eka','Farah','Gilang','Hana'].map((name,i)=>{const stage=['registered','instrument','instrument','instrument','commit','final','final','final'][i],answered=[0,4,8,20,24,24,24,24][i],now=new Date(Date.now()-i*60000).toISOString();return {id:'demo'+i,name,code:'CONTOH-'+(i+1),group:i<4?'Kelompok 1':'Kelompok 2',startedAt:now,updatedAt:now,answered,stage,percent:stage==='registered'?0:stage==='instrument'?Math.round(answered/24*75):stage==='commit'?94:100,completedAt:stage==='final'?now:'',report:stage==='final'?scoreInstrument(Array.from({length:24},(_,j)=>j%4===3?2:2+i%3)):null,habit:stage==='final'?HABITS[i%3]:'',commitment:stage==='final'&&i%2?{shared:true,action:'Menyebut kontribusi setiap anggota saat melaporkan hasil kelompok.',when:'Pertemuan kelompok besok.',support:'Menyiapkan catatan kontribusi.'}:null};});}
document.addEventListener('input',e=>{if(e.target.id==='liveSearch'){liveSearch=e.target.value;renderLiveTable();}if(e.target.dataset.field)saveLiveDraft();});
document.addEventListener('change',e=>{if(e.target.id==='liveGroupFilter'){liveGroup=e.target.value;renderLiveTable();}if(e.target.id==='liveStatusFilter'){liveFilter=e.target.value;renderLiveTable();}if(e.target.dataset.item!==undefined)queueLiveState();});
document.addEventListener('click',async e=>{const b=e.target.closest('[data-action]');if(!b)return;switch(b.dataset.action){case 'dashboard':enterLiveDashboard();break;case 'participantHome':move('home');break;case 'liveBegin':await beginLive(b);break;case 'liveOfflinePreview':liveRegistered=false;move('instrument');break;case 'liveRefresh':await refreshLiveDashboard();break;case 'liveDemo':stopLivePolling();liveDemo=true;liveRecords=sampleLive();liveSearch='';liveGroup='';liveFilter='';renderDashboard();break;case 'liveLogout':stopLivePolling();liveRecords=[];liveDemo=false;liveLastRefresh='';liveDashboardError='';move('home');break;case 'liveCsv':exportLiveCsv();break;case 'liveDetail':liveDetail(Number(b.dataset.index));break;case 'dashboardPrint':document.body.classList.add('print-dashboard');window.print();break;}});
window.addEventListener('afterprint',()=>document.body.classList.remove('print-dashboard'));
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&state.step==='dashboard'&&liveConfigured()&&!liveDemo)refreshLiveDashboard();});

$('#brandMount').innerHTML=brandLogos();
render();
if(liveSyncText)liveSetStatus(liveSyncText);
</script>
</body>
</html>
